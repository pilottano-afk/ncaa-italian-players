name: Import NCAA 2026-27 data into PostgreSQL

on:
  # GitHub cron is UTC: 07:00 UTC is 08:00 in Italy during CET.
  # During CEST it runs at 09:00 local time; GitHub cron does not follow DST.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ncaa-2027-database-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check database connection secret
        id: dbsecret
        env:
          DATABASE_URL: ${{ secrets.NCAA_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::NCAA_DATABASE_URL is not configured. Import skipped; no data was downloaded or written."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.dbsecret.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.dbsecret.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        if: steps.dbsecret.outputs.skip != 'true'
        run: python -m pip install -e .

      - name: Download and validate current-season datasets
        if: steps.dbsecret.outputs.skip != 'true'
        run: >-
          ncaa-stage --datasets schedule team_rosters rosters player_box team_box
          shots team_ids
          --output data/staging/2027

      - name: Audit source rows before database writes
        if: steps.dbsecret.outputs.skip != 'true'
        run: >-
          ncaa-audit --input data/staging/2027
          --output data/staging/2027/quality-audit.json

      - name: Import original records into PostgreSQL
        if: steps.dbsecret.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.NCAA_DATABASE_URL }}
        run: ncaa-import-raw --input data/staging/2027 --batch-size 500

      - name: Publish import summary
        if: always()
        run: |
          if [ "${{ steps.dbsecret.outputs.skip }}" = "true" ]; then
            echo "### NCAA 2026-27 import skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Configure repository secret NCAA_DATABASE_URL to enable the daily import." >> "$GITHUB_STEP_SUMMARY"
          elif [ -f data/staging/2027/manifest.json ]; then
            echo "### NCAA 2026-27 import" >> "$GITHUB_STEP_SUMMARY"
            echo "Season: 2026-27 (season key 2027). Historical seasons are disabled." >> "$GITHUB_STEP_SUMMARY"
            echo "Imported datasets: schedule, team_rosters, rosters, player_box, team_box, shots, team_ids." >> "$GITHUB_STEP_SUMMARY"
            echo "Large raw datasets (pbp, possessions, lineups, matchup_stints) are intentionally excluded to stay within database storage limits." >> "$GITHUB_STEP_SUMMARY"
          fi
