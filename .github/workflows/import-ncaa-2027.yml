name: Import NCAA 2026-27 data into PostgreSQL

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ncaa-2027-database-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check database connection secret
        env:
          DATABASE_URL: ${{ secrets.NCAA_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing repository secret NCAA_DATABASE_URL. Add a PostgreSQL connection URL in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Download and validate current-season datasets
        run: >-
          ncaa-stage --datasets schedule team_rosters rosters pbp player_box team_box
          lineups matchup_stints possessions shots team_ids
          --output data/staging/2027

      - name: Audit source rows before database writes
        run: >-
          ncaa-audit --input data/staging/2027
          --output data/staging/2027/quality-audit.json

      - name: Import original records into PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.NCAA_DATABASE_URL }}
        run: ncaa-import-raw --input data/staging/2027 --batch-size 500

      - name: Publish import summary
        if: always()
        run: |
          if [ -f data/staging/2027/manifest.json ]; then
            echo "### NCAA 2026-27 import" >> "$GITHUB_STEP_SUMMARY"
            echo "Season: 2026-27 (season key 2027). Historical seasons are disabled." >> "$GITHUB_STEP_SUMMARY"
          fi
