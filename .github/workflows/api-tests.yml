name: API tests

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ncaa
          POSTGRES_PASSWORD: ncaa
          POSTGRES_DB: ncaa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ncaa -d ncaa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ncaa:ncaa@localhost:5432/ncaa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run unit and PostgreSQL integration tests
        run: python -m pytest -q
