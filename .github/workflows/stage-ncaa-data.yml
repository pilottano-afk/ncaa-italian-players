name: NCAA 2026-27 data staging

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

concurrency:
  group: ncaa-2027-data-staging
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Download and inspect all 2026-27 datasets
        run: >
          ncaa-stage
          --datasets schedule team_rosters rosters pbp player_box team_box
          lineups matchup_stints possessions shots team_ids
          --output data/staging/2027

      - name: Upload staging files and schema manifest
        uses: actions/upload-artifact@v4
        with:
          name: ncaa-2027-staging-${{ github.run_id }}
          path: data/staging/2027/
          if-no-files-found: error
          retention-days: 7
